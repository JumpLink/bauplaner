name: CI

on:
  push:
    branches: [main]
  pull_request:

# Node-free gjsify toolchain (mirrors the buchhaltung CI). Everything runs on the
# gjsify stack pinned in cli/package.json: `gjsify install --immutable` (from
# gjsify-lock.json), the bundled `gjsify tsc` type-check, `gjsify build` for the
# CLI + native-app bundles, and the GJS test bundle under `gjs`. Node is present
# only to bootstrap the gjsify CLI (its published bin is Node; its work targets
# gjs).
#
# System libraries: the builds only *bundle* and never load a gi:// typelib, and
# almost every test is pure TypeScript — so no GTK or GL is needed. The one
# exception is the PDF renderer, which draws through cairo + PangoCairo at
# runtime; `pango` is installed so that test actually executes here instead of
# skipping.
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      # pango ships the PangoCairo typelib the PDF renderer needs. Without it the
      # render test skips and the renderer would never run in CI at all — the
      # build only bundles, it never loads a gi:// typelib, so nothing else would
      # have noticed a broken export.
      - name: Install system prerequisites (gjs + PangoCairo typelib)
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git tar xz findutils gjs pango

      - uses: actions/checkout@v4

      # Node 24 to bootstrap + run the gjsify CLI. gjsify's native install-backend
      # prebuilds target node 24 — Fedora's default node 22 loads a mismatched ABI
      # and segfaults `gjsify install`.
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Content-addressed tarball store: a warm cache lets `gjsify install --immutable`
      # skip the download phase. Keyed on the lockfile.
      - name: Cache gjsify tarball store
        uses: actions/cache@v4
        with:
          path: ~/.cache/gjsify/tarballs
          key: gjsify-tarballs-${{ hashFiles('gjsify-lock.json') }}
          restore-keys: gjsify-tarballs-

      # Bootstrap the gjsify CLI so `gjsify install` is runnable before node_modules
      # exists. It must be the SAME version the deps pin — a global-CLI ↔
      # pinned-libs mismatch produces broken bundles. Read that version out of
      # cli/package.json instead of repeating it here: hardcoded, it silently fell
      # behind when the workspace moved 0.16.5 → 0.26.0 and CI kept bootstrapping
      # the old CLI.
      - name: Bootstrap the gjsify CLI
        run: |
          VERSION=$(node -p "require('./cli/package.json').devDependencies['@gjsify/cli']")
          echo "Bootstrapping @gjsify/cli@$VERSION (from cli/package.json)"
          npm install -g "@gjsify/cli@$VERSION"

      - name: Install dependencies (gjsify install --immutable)
        run: gjsify install --immutable

      # One entry point: cli's `check` runs gjsify tsc over the CLI + app, then
      # tsc over every packages/*/tsconfig.json, then the Adwaita markup scan.
      # It replaces a hand-written package list that had to be extended by hand
      # for each new package — and would have missed @bauplaner/report.
      - name: Type check (cli + every package) and markup scan
        run: npm run check --workspace cli

      - name: Build (CLI + native-app bundles)
        run: |
          npm run build --workspace cli
          npm run build:app --workspace cli

      - name: Tests (GJS test bundle under gjs)
        run: npm run test --workspace cli
