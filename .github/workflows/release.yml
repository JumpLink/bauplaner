name: Release

# A tag is a release: `git tag v0.1.0 && git push --tags` builds every target through CI and
# hangs the packages off the tag on GitHub. The build itself is NOT repeated here — the `build`
# job below calls ci.yml, so there is exactly one definition of how the toolchain is installed
# and what "green" means. A release therefore cannot be cut from a commit whose tests, type
# check, lint or packaging proof did not pass.
#
# ci.yml ships `ship-bauplaner` (deb, rpm, AppImage, both macos-app-zips, windows-dir-zip, msi)
# and `ship-flatpak` (.flatpak) as uploaded artifacts, already proven there: the rpm is installed
# with the system package manager and the installed app is started under Xvfb before anything is
# uploaded. This job only fetches those artifacts and attaches them — repeating the build here
# would be a second copy of a toolchain this repository has decided to define once.
on:
  push:
    tags: ['v*']
  # Re-cut assets for a tag that already exists, without moving the tag. The ref actually built
  # is whichever branch/tag is picked when the run is dispatched (the "Use workflow from" selector
  # in the Actions UI) — `tag` below names what the artifacts are asserted and attached against.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build from (e.g. v0.2.0). Empty = the selected branch."
        required: false
        default: ""
        type: string
      publish:
        description: "Attach the artifacts to the GitHub release (needs a tag)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Two tags pushed seconds apart would otherwise run twice against one release and upload in
# whichever order finished last. Queued rather than cancelled: a half-uploaded release is worse
# than a slow one.
concurrency:
  group: release-${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Attach to the release
    needs: build
    # A branch dry run (workflow_dispatch with no tag or publish=false) builds the artifacts and
    # stops there: `inputs.publish` alone is not enough, because the name it would upload to is a
    # branch, not a release.
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (inputs.publish && inputs.tag != '') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # The CLI's packages, out of CI rather than built here (see the header). `ship-*` matches
      # both upload names ci.yml writes (`ship-bauplaner`, `ship-flatpak`), merged into one
      # directory — a release either carries all of them or does not exist yet.
      - name: Fetch the packages CI built
        uses: actions/download-artifact@v4
        with:
          pattern: ship-*
          merge-multiple: true
          path: assets

      # Names are the ones `gjsify ship` actually renders (ci.yml's own assert steps derive the
      # same ones from a real local run, not guessed), from the TAG rather than a checkout — this
      # job never checks the repo out.
      - name: Assert every artifact arrived
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          ls -la assets
          version="${TAG#v}"
          binary=bauplaner
          missing=0
          for f in \
            "${binary}_${version}-1_amd64.deb" \
            "${binary}-${version}-1.x86_64.rpm" \
            "${binary}-${version}-1.x86_64.AppImage" \
            "${binary}-${version}-1.macos.arm64.zip" \
            "${binary}-${version}-1.macos.x86_64.zip" \
            "${binary}-${version}-1.windows.x64.zip" \
            "${binary}-${version}-1.x64.msi" \
            "eu.jumplink.Bauplaner-${version}-1.x86_64.flatpak"; do
            if [ ! -s "assets/$f" ]; then
              echo "::error::missing or empty artifact: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      # A tag push creates no release on its own, and `gh release upload` against a tag with none
      # fails with "release not found" after every artifact has already been built. Create it
      # first when missing — as a draft, so the notes can be written before anyone is notified —
      # and leave an existing one alone, which is what makes re-running this on a tag safe.
      # `--clobber` on the upload makes a re-cut replace stale assets instead of erroring on a
      # name collision.
      - name: Attach everything to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          ls -la assets
          [ -n "$(ls -A assets)" ] || { echo "::error::no packages were downloaded"; exit 1; }
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "no release for $TAG yet — creating it as a draft"
            gh release create "$TAG" --title "$TAG" --draft --generate-notes
          fi
          gh release upload "$TAG" assets/* --clobber
          echo "Attached $(find assets -maxdepth 1 -type f | wc -l) asset(s) to $TAG:"
          gh release view "$TAG" --json assets --jq '.assets[].name'

      # Linux (`.deb`, `.rpm`, `.AppImage`, `.flatpak`), macOS (arm64 + x64, `macos-app-zip`) and
      # Windows (x64, `windows-dir-zip` + `.msi`) ARE all attached now, from `assets/` above —
      # assembling the macOS/Windows payloads does not need a Mac or a Windows runner (ci.yml),
      # only naming the target so `gjsify install` does not skip the `optionalDependencies`
      # runtime it would otherwise stage with no interpreter in it. What this does NOT do is RUN
      # the Mach-O or PE payload: that is verified on its own OS or not at all, so a
      # `macos-latest` / `windows-latest` job staying absent is a gap in verification, not in the
      # release's contents, and the honest place to close it if it matters later.
      #
      # UNSIGNED on macOS and Windows, by design (ADR 0024 § A13 in gjsify) — this is a
      # legitimate deliverable, not a placeholder. Where signing would attach, on a runner that
      # actually holds the identity:
      #   macOS   — `gjsify ship darwin --arch <arch> --skip-build --target macos-app-zip --sign
      #             <identity>` (Developer ID; `--notarize <keychain-profile>` on top of that)
      #   Windows — same shape, `--sign <certificate thumbprint or PFX path>` reaching `signtool`
      #             (UNVERIFIED upstream: no run in gjsify has ever invoked it)
